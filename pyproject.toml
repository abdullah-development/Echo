[project]
name = "live-reply-agent"
version = "0.1.0"
description = "Hears system audio, detects questions, drafts human-like replies from your docs"
readme = "README.md"
authors = [
    { name = "Abdullah Nadeem", email = "abdullah@devminified.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "onnx-asr>=0.12.0",
    "onnxruntime<1.20",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]


[tool.uv]
package = false
